<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>SPIKE CONTROL</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080c14;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    width: 100vw;
    height: 100dvh;
}

#app {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
}


/* =====================================================
   CABECERA
   ===================================================== */

#top {
    position: absolute;

    top: 1vh;
    left: 1vw;
    right: 1vw;

    height: 7vh;
    min-height: 34px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 1.5vw;

    background: #111827;
    border: 1px solid #263247;
    border-radius: 12px;

    z-index: 100;
}

#titulo {
    font-size: clamp(13px, 3vw, 22px);
    font-weight: bold;
}

#estado {
    margin-right: 9vw;
    font-size: clamp(9px, 2vw, 14px);
    font-weight: bold;
    color: #facc15;
}


/* =====================================================
   FULLSCREEN
   ===================================================== */

#fullscreen {
    position: fixed;

    top: 1vh;
    right: 1vw;

    width: clamp(38px, 8vw, 75px);
    height: clamp(32px, 6vh, 42px);

    border: none;
    border-radius: 10px;

    background: #334155;
    color: white;

    font-size: clamp(16px, 3vw, 21px);

    z-index: 200;

    touch-action: manipulation;
}


/* =====================================================
   CONTROLES
   ===================================================== */

#control {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
}


/* =====================================================
   JOYSTICKS
   ===================================================== */

.joystickArea {
    position: absolute;

    width: 28vw;
    height: 45vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;
}

.joystickTitulo {
    margin-bottom: 1vh;

    color: #94a3b8;

    font-size: clamp(8px, 2vw, 14px);
    font-weight: bold;
}

.joystick {
    width: min(27vw, 190px);
    height: min(27vw, 190px);

    min-width: 105px;
    min-height: 105px;

    max-width: 190px;
    max-height: 190px;

    position: relative;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #263653 0%,
            #172238 55%,
            #0f172a 100%
        );

    border: 3px solid #334155;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.5),
        0 5px 18px rgba(0,0,0,.4);

    touch-action: none;
}

.joystick::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 2px;
    height: 80%;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.joystick::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 80%;
    height: 2px;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.palanca {
    position: absolute;

    width: min(10vw, 65px);
    height: min(10vw, 65px);

    min-width: 45px;
    min-height: 45px;

    max-width: 65px;
    max-height: 65px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #64748b,
            #334155 55%,
            #1e293b
        );

    border: 3px solid #64748b;

    box-shadow:
        0 6px 15px rgba(0,0,0,.6),
        inset 0 3px 7px rgba(255,255,255,.15);

    pointer-events: none;
}

#joystickIzquierdo {
    left: 1vw;
    top: 52%;
    transform: translateY(-50%);
}

#joystickDerecho {
    right: 12vw;
    top: 52%;
    transform: translateY(-50%);
}


/* =====================================================
   CENTRO / ROBOT
   ===================================================== */

#centro {
    position: absolute;

    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 1vh;

    z-index: 30;
}

#robot {
    width: clamp(65px, 10vw, 100px);
    height: clamp(65px, 10vw, 100px);

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: clamp(30px, 6vw, 55px);

    background: #172238;

    border: 3px solid #475569;

    border-radius: 20px;

    box-shadow:
        0 0 20px rgba(34,197,94,.15);
}

#robotFlecha {
    position: absolute;

    top: -20px;

    font-size: clamp(15px, 3vw, 25px);

    color: #22c55e;
}

#freno,
#centrar {
    width: clamp(75px, 15vw, 115px);

    height: clamp(36px, 7vh, 50px);

    border: none;
    border-radius: 12px;

    color: white;

    font-size: clamp(9px, 2vw, 14px);

    font-weight: bold;

    touch-action: manipulation;
}

#freno {
    background: #dc2626;
}

#centrar {
    background: #475569;
}

#freno:active,
#centrar:active {
    transform: scale(.94);
}


/* =====================================================
   INFORMACIÓN ROBOT
   ===================================================== */

#robotInfo {
    position: absolute;

    left: 50%;
    top: calc(52% + 17vh);

    transform: translateX(-50%);

    width: min(35vw, 250px);

    padding: 6px;

    background: rgba(17,24,39,.9);

    border: 1px solid #334155;

    border-radius: 10px;

    text-align: center;

    font-size: clamp(7px, 1.6vw, 11px);

    color: #94a3b8;

    z-index: 25;
}

#robotInfo span {
    color: white;
}


/* =====================================================
   BARRAS
   ===================================================== */

#barrasDerecha {
    position: fixed;

    right: .8vw;
    top: 52%;

    transform: translateY(-50%);

    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 2vh;

    z-index: 100;
}

.medidorContenedor {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: .5vh;
}

.medidorTitulo {
    font-size: clamp(7px, 1.5vw, 11px);

    color: #94a3b8;

    writing-mode: vertical-rl;

    transform: rotate(180deg);
}

.medidor {
    width: clamp(16px, 3vw, 27px);

    height: min(28vh, 145px);

    min-height: 70px;

    position: relative;

    overflow: hidden;

    background: #111827;

    border: 2px solid #64748b;

    border-radius: 14px;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.5);
}

.medidorCentro {
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 2px;

    background: white;

    z-index: 3;
}

.medidorRelleno {
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 0;

    background: #22c55e;

    z-index: 2;
}

.medidorValor {
    font-size: clamp(7px, 1.5vw, 11px);

    color: #94a3b8;
}


/* =====================================================
   PANEL DE DIAGNÓSTICO
   ===================================================== */

#diagnostico {
    position: fixed;

    left: 1vw;
    top: 10vh;

    width: clamp(145px, 18vw, 220px);

    padding: 10px;

    background: rgba(15,23,42,.96);

    border: 1px solid #334155;

    border-radius: 12px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);

    z-index: 120;
}

#diagnosticoTitulo {
    margin-bottom: 7px;

    padding-bottom: 5px;

    border-bottom: 1px solid #334155;

    font-size: clamp(10px, 1.7vw, 14px);

    font-weight: bold;

    text-align: center;

    color: #e2e8f0;
}

.diagnosticoLinea {
    display: flex;

    align-items: center;
    justify-content: space-between;

    min-height: 20px;

    font-size: clamp(8px, 1.4vw, 11px);
}

.diagnosticoLinea span:first-child {
    color: #94a3b8;
}

.diagnosticoLinea span:last-child {
    color: white;
    font-weight: bold;
}

#diagConexion {
    color: #facc15 !important;
}

.bateriaBarra {
    width: 55px;
    height: 8px;

    margin-left: 5px;

    overflow: hidden;

    background: #1e293b;

    border: 1px solid #475569;

    border-radius: 5px;
}

#bateriaRelleno {
    width: 87%;
    height: 100%;

    background: #22c55e;

    transition: width .3s;
}


/* =====================================================
   TURBO
   ===================================================== */

#turbo {
    position: fixed;

    left: 1vw;
    bottom: 1vh;

    width: clamp(70px, 10vw, 105px);
    height: clamp(34px, 6vh, 45px);

    border: none;

    border-radius: 10px;

    background: #7c3aed;

    color: white;

    font-size: clamp(9px, 1.7vw, 13px);

    font-weight: bold;

    z-index: 80;

    touch-action: manipulation;
}

#turbo.activo {
    background: #f59e0b;

    box-shadow:
        0 0 18px rgba(245,158,11,.6);
}


/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

#config {
    position: fixed;

    left: 50%;

    bottom: 1vh;

    transform: translateX(-50%);

    width: min(35vw, 320px);

    padding: 4px 7px;

    background: #111827;

    border: 1px solid #263247;

    border-radius: 10px;

    z-index: 50;
}

.configLinea {
    display: flex;

    align-items: center;

    gap: 5px;

    margin: 2px 0;
}

.configLinea span {
    width: 55px;

    font-size: 8px;

    color: #cbd5e1;
}

input[type="range"] {
    flex: 1;

    min-width: 0;

    height: 15px;
}

.configLinea b {
    font-size: 8px;

    min-width: 28px;
}


/* =====================================================
   CONECTAR
   ===================================================== */

#conectar {
    position: fixed;

    right: 4vw;
    bottom: 1vh;

    width: min(18vw, 160px);

    height: clamp(32px, 6vh, 42px);

    border: none;

    border-radius: 10px;

    background: #22c55e;

    color: #052e16;

    font-size: clamp(8px, 1.8vw, 13px);

    font-weight: bold;

    z-index: 60;
}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 600px) {

    #titulo {
        font-size: 14px;
    }

    #estado {
        margin-right: 55px;
        font-size: 9px;
    }

    .joystick {
        width: 29vw;
        height: 29vw;

        min-width: 105px;
        min-height: 105px;
    }

    .palanca {
        width: 15vw;
        height: 15vw;

        min-width: 45px;
        min-height: 45px;
    }

    #joystickIzquierdo {
        left: .5vw;
    }

    #joystickDerecho {
        right: 13vw;
    }

    #barrasDerecha {
        right: .5vw;
    }

    #diagnostico {
        width: 135px;
        padding: 7px;
    }

    #config {
        width: 42vw;
    }

    #conectar {
        right: 3vw;
        width: 20vw;
    }

    #robotInfo {
        top: calc(52% + 16vh);
    }

}


/* =====================================================
   PANTALLA BAJA
   ===================================================== */

@media (max-height: 450px) {

    #top {
        height: 34px;
    }

    .joystick {
        width: min(27vw, 155px);
        height: min(27vw, 155px);

        min-width: 95px;
        min-height: 95px;
    }

    .palanca {
        width: 50px;
        height: 50px;
    }

    .medidor {
        height: 100px;
    }

    #centro {
        gap: 3px;
    }

    #robot {
        width: 60px;
        height: 60px;
        font-size: 30px;
    }

    #robotInfo {
        top: calc(52% + 18vh);
    }

    #diagnostico {
        top: 45px;
        width: 150px;
        padding: 5px;
    }

    #config {
        display: none;
    }

    #conectar {
        bottom: 3px;
    }

}


/* =====================================================
   VERTICAL
   ===================================================== */

@media (orientation: portrait) {

    #app::after {
        content: "↻  GIRA EL TELÉFONO";

        position: fixed;

        inset: 0;

        z-index: 99999;

        display: flex;

        align-items: center;
        justify-content: center;

        background: #080c14;

        color: white;

        font-size: 23px;

        font-weight: bold;
    }

}

</style>

</head>


<body>

<div id="app">


<!-- =====================================================
     CABECERA
     ===================================================== -->

<div id="top">

    <div id="titulo">
        🎮 SPIKE CONTROL
    </div>

    <div id="estado">
        🟡 SIMULACIÓN
    </div>

</div>


<!-- =====================================================
     FULLSCREEN
     ===================================================== -->

<button id="fullscreen">
    ⛶
</button>


<!-- =====================================================
     PANEL DIAGNÓSTICO
     ===================================================== -->

<div id="diagnostico">

    <div id="diagnosticoTitulo">
        📊 DIAGNÓSTICO
    </div>


    <div class="diagnosticoLinea">
        <span>CONEXIÓN</span>
        <span id="diagConexion">
            SIMULACIÓN
        </span>
    </div>


    <div class="diagnosticoLinea">
        <span>HUB</span>
        <span id="diagHub">
            SPIKE PRIME
        </span>
    </div>


    <div class="diagnosticoLinea">

        <span>BATERÍA</span>

        <span>

            <span id="diagBateria">
                87%
            </span>

            <span class="bateriaBarra">

                <span id="bateriaRelleno"></span>

            </span>

        </span>

    </div>


    <div class="diagnosticoLinea">
        <span>MOTOR A</span>
        <span id="diagA">0%</span>
    </div>


    <div class="diagnosticoLinea">
        <span>MOTOR B</span>
        <span id="diagB">0°</span>
    </div>


    <div class="diagnosticoLinea">
        <span>MOTOR D</span>
        <span id="diagD">0%</span>
    </div>


    <div class="diagnosticoLinea">
        <span>VELOCIDAD</span>
        <span id="diagVelocidad">0%</span>
    </div>


    <div class="diagnosticoLinea">
        <span>DIRECCIÓN</span>
        <span id="diagDireccion">
            CENTRO
        </span>
    </div>


    <div class="diagnosticoLinea">
        <span>DISTANCIA</span>
        <span id="diagDistancia">
            0.0 m
        </span>
    </div>


    <div class="diagnosticoLinea">
        <span>FPS</span>
        <span id="diagFPS">
            60
        </span>
    </div>

</div>


<!-- =====================================================
     CONTROLES
     ===================================================== -->

<div id="control">


<!-- =====================================================
     JOYSTICK MOVIMIENTO
     ===================================================== -->

<div
    id="joystickIzquierdo"
    class="joystickArea"
>

    <div class="joystickTitulo">
        MOVIMIENTO
    </div>

    <div
        id="joystickMovimiento"
        class="joystick"
    >

        <div class="palanca"></div>

    </div>

</div>


<!-- =====================================================
     ROBOT VIRTUAL
     ===================================================== -->

<div id="centro">

    <div id="robot">

        <div id="robotFlecha">
            ▲
        </div>

        🤖

    </div>


    <button id="freno">
        ⏹ FRENO
    </button>


    <button id="centrar">
        🎯 CENTRAR
    </button>

</div>


<!-- =====================================================
     INFORMACIÓN ROBOT
     ===================================================== -->

<div id="robotInfo">

    A:
    <span id="motorA">
        0%
    </span>

    &nbsp; | &nbsp;

    D:
    <span id="motorD">
        0%
    </span>

    &nbsp; | &nbsp;

    B:
    <span id="motorB">
        0°
    </span>

</div>


<!-- =====================================================
     JOYSTICK DIRECCIÓN
     ===================================================== -->

<div
    id="joystickDerecho"
    class="joystickArea"
>

    <div class="joystickTitulo">
        DIRECCIÓN
    </div>

    <div
        id="joystickDireccion"
        class="joystick"
    >

        <div class="palanca"></div>

    </div>

</div>


<!-- =====================================================
     CONFIGURACIÓN
     ===================================================== -->

<div id="config">


    <div class="configLinea">

        <span>
            VELOCIDAD
        </span>

        <input
            id="velocidad"
            type="range"
            min="100"
            max="1000"
            value="700"
            step="50"
        >

        <b id="velocidadValor">
            700
        </b>

    </div>


    <div class="configLinea">

        <span>
            ÁNGULO
        </span>

        <input
            id="angulo"
            type="range"
            min="10"
            max="180"
            value="90"
            step="5"
        >

        <b id="anguloValor">
            90°
        </b>

    </div>

</div>


<!-- =====================================================
     TURBO
     ===================================================== -->

<button id="turbo">
    ⚡ TURBO
</button>


<!-- =====================================================
     CONECTAR
     ===================================================== -->

<button id="conectar">
    🔵 CONECTAR HUB
</button>


</div>


<!-- =====================================================
     BARRAS DERECHA
     ===================================================== -->

<div id="barrasDerecha">


    <div class="medidorContenedor">

        <div class="medidorTitulo">
            MOV.
        </div>

        <div class="medidor">

            <div
                id="rellenoMovimiento"
                class="medidorRelleno"
            ></div>

            <div
                class="medidorCentro"
            ></div>

        </div>

        <div
            id="valorMovimiento"
            class="medidorValor"
        >
            0%
        </div>

    </div>


    <div class="medidorContenedor">

        <div class="medidorTitulo">
            DIR.
        </div>

        <div class="medidor">

            <div
                id="rellenoDireccion"
                class="medidorRelleno"
            ></div>

            <div
                class="medidorCentro"
            ></div>

        </div>

        <div
            id="valorDireccion"
            class="medidorValor"
        >
            0%
        </div>

    </div>


</div>


</div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const joystickMovimiento =
    document.getElementById(
        "joystickMovimiento"
    );

const joystickDireccion =
    document.getElementById(
        "joystickDireccion"
    );

const rellenoMovimiento =
    document.getElementById(
        "rellenoMovimiento"
    );

const rellenoDireccion =
    document.getElementById(
        "rellenoDireccion"
    );

const valorMovimiento =
    document.getElementById(
        "valorMovimiento"
    );

const valorDireccion =
    document.getElementById(
        "valorDireccion"
    );

const velocidad =
    document.getElementById(
        "velocidad"
    );

const velocidadValor =
    document.getElementById(
        "velocidadValor"
    );

const angulo =
    document.getElementById(
        "angulo"
    );

const anguloValor =
    document.getElementById(
        "anguloValor"
    );

const freno =
    document.getElementById(
        "freno"
    );

const centrar =
    document.getElementById(
        "centrar"
    );

const fullscreen =
    document.getElementById(
        "fullscreen"
    );

const estado =
    document.getElementById(
        "estado"
    );

const motorA =
    document.getElementById(
        "motorA"
    );

const motorB =
    document.getElementById(
        "motorB"
    );

const motorD =
    document.getElementById(
        "motorD"
    );

const robot =
    document.getElementById(
        "robot"
    );

const robotFlecha =
    document.getElementById(
        "robotFlecha"
    );

const turbo =
    document.getElementById(
        "turbo"
    );


/* =========================================================
   DIAGNÓSTICO
   ========================================================= */

const diagA =
    document.getElementById("diagA");

const diagB =
    document.getElementById("diagB");

const diagD =
    document.getElementById("diagD");

const diagVelocidad =
    document.getElementById(
        "diagVelocidad"
    );

const diagDireccion =
    document.getElementById(
        "diagDireccion"
    );

const diagDistancia =
    document.getElementById(
        "diagDistancia"
    );

const diagFPS =
    document.getElementById(
        "diagFPS"
    );

const diagBateria =
    document.getElementById(
        "diagBateria"
    );

const bateriaRelleno =
    document.getElementById(
        "bateriaRelleno"
    );


/* =========================================================
   VARIABLES
   ========================================================= */

let velocidadActual = 0;

let direccionActual = 0;

let anguloActual = 0;

let rotacion = 0;

let distancia = 0;

let frenado = false;

let turboActivo = false;

let teclas = {};


/* =========================================================
   VELOCIDAD
   ========================================================= */

velocidad.addEventListener(
    "input",
    () => {

        velocidadValor.textContent =
            velocidad.value;

    }
);


/* =========================================================
   ÁNGULO
   ========================================================= */

angulo.addEventListener(
    "input",
    () => {

        anguloValor.textContent =
            angulo.value + "°";

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

async function entrarFullscreen() {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

            fullscreen.textContent =
                "✕";


            if (
                screen.orientation &&
                screen.orientation.lock
            ) {

                try {

                    await screen.orientation.lock(
                        "landscape"
                    );

                } catch (error) {

                    console.log(
                        "Orientación no disponible"
                    );

                }

            }

        } else {

            await document.exitFullscreen();

            fullscreen.textContent =
                "⛶";

        }

    } catch (error) {

        console.log(
            "Fullscreen no disponible:",
            error
        );

}

/* =========================================================
   JOYSTICK
   ========================================================= */

function crearJoystick(elemento) {

    const palanca =
        elemento.querySelector(
            ".palanca"
        );

    let activo = false;

    let x = 0;
    let y = 0;


    function mover(evento) {

        if (!activo) {
            return;
        }


        const rect =
            elemento.getBoundingClientRect();


        const centroX =
            rect.width / 2;

        const centroY =
            rect.height / 2;


        let nuevaX =
            evento.clientX -
            rect.left -
            centroX;


        let nuevaY =
            evento.clientY -
            rect.top -
            centroY;


        const max =
            rect.width / 2 - 35;


        const distanciaJoystick =
            Math.sqrt(
                nuevaX * nuevaX +
                nuevaY * nuevaY
            );


        if (
            distanciaJoystick > max
        ) {

            nuevaX =
                nuevaX /
                distanciaJoystick *
                max;

            nuevaY =
                nuevaY /
                distanciaJoystick *
                max;

        }


        x =
            nuevaX / max;

        y =
            nuevaY / max;


        palanca.style.left =
            `calc(50% + ${nuevaX}px)`;


        palanca.style.top =
            `calc(50% + ${nuevaY}px)`;


        actualizarControl();

    }


    function soltar() {

        activo = false;

        x = 0;
        y = 0;


        palanca.style.left =
            "50%";

        palanca.style.top =
            "50%";


        actualizarControl();

    }


    elemento.addEventListener(
        "pointerdown",
        evento => {

            activo = true;

            elemento.setPointerCapture(
                evento.pointerId
            );

            mover(evento);

        }
    );


    elemento.addEventListener(
        "pointermove",
        mover
    );


    elemento.addEventListener(
        "pointerup",
        soltar
    );


    elemento.addEventListener(
        "pointercancel",
        soltar
    );


    return {

        obtenerX: () => x,

        obtenerY: () => y

    };

}


const movimiento =
    crearJoystick(
        joystickMovimiento
    );


const direccion =
    crearJoystick(
        joystickDireccion
    );


/* =========================================================
   BARRA MOVIMIENTO
   ========================================================= */

function actualizarBarraMovimiento(valor) {

    const porcentaje =
        Math.min(
            100,
            Math.abs(valor) * 100
        );


    valorMovimiento.textContent =
        Math.round(porcentaje) + "%";


    if (valor < 0) {

        rellenoMovimiento.style.top =
            (50 - porcentaje / 2) + "%";

        rellenoMovimiento.style.height =
            porcentaje + "%";

    }

    else if (valor > 0) {

        rellenoMovimiento.style.top =
            "50%";

        rellenoMovimiento.style.height =
            porcentaje + "%";

    }

    else {

        rellenoMovimiento.style.top =
            "50%";

        rellenoMovimiento.style.height =
            "0%";

    }

}

/* =========================================================
   SIMULACIÓN
   ========================================================= */

function actualizarSimulacion() {

    let movimientoY =
        movimiento.obtenerY();

    let direccionX =
        direccion.obtenerX();


    /* WASD */

    if (teclas["w"]) {
        movimientoY = -1;
    }

    if (teclas["s"]) {
        movimientoY = 1;
    }

    if (teclas["a"]) {
        direccionX = -1;
    }

    if (teclas["d"]) {
        direccionX = 1;
    }


    if (frenado) {

        movimientoY = 0;
        direccionX = 0;

    }


    velocidadActual =
        -movimientoY;


    direccionActual =
        direccionX;


    const multiplicadorTurbo =
        turboActivo
            ? 1.5
            : 1;


    let motorIzquierdo =
        (
            velocidadActual -
            direccionActual
        ) * multiplicadorTurbo;


    let motorDerecho =
        (
            velocidadActual +
            direccionActual
        ) * multiplicadorTurbo;


    motorIzquierdo =
        Math.max(
            -1,
            Math.min(
                1,
                motorIzquierdo
            )
        );


    motorDerecho =
        Math.max(
            -1,
            Math.min(
                1,
                motorDerecho
            )
        );


    anguloActual =
        direccionActual *
        Number(
            angulo.value
        );


    /* =====================================================
       MOSTRAR DATOS
       ===================================================== */

    const porcentajeA =
        Math.round(
            motorIzquierdo * 100
        );

    const porcentajeD =
        Math.round(
            motorDerecho * 100
        );


    motorA.textContent =
        porcentajeA + "%";


    motorD.textContent =
        porcentajeD + "%";


    motorB.textContent =
        Math.round(
            anguloActual
        ) + "°";


    diagA.textContent =
        porcentajeA + "%";


    diagD.textContent =
        porcentajeD + "%";


    diagB.textContent =
        Math.round(
            anguloActual
        ) + "°";


    const velocidadPorcentaje =
        Math.round(
            Math.abs(
                velocidadActual
            ) * 100
        );


    diagVelocidad.textContent =
        velocidadPorcentaje + "%";


    if (
        direccionActual < -0.1
    ) {

        diagDireccion.textContent =
            "IZQUIERDA";

    }

    else if (
        direccionActual > 0.1
    ) {

        diagDireccion.textContent =
            "DERECHA";

    }

    else {

        diagDireccion.textContent =
            "CENTRO";

    }


    /* =====================================================
       DISTANCIA SIMULADA
       ===================================================== */

    distancia +=
        Math.abs(
            velocidadActual
        ) *
        0.0008 *
        (turboActivo ? 1.5 : 1);


    diagDistancia.textContent =
        distancia.toFixed(1) +
        " m";


    /* =====================================================
       GIRAR ROBOT
       ===================================================== */

    rotacion +=
        direccionActual *
        velocidadActual *
        2;


    robot.style.transform =
        `rotate(${rotacion}deg)`;


    robotFlecha.style.transform =
        `rotate(${-rotacion}deg)`;


    /* =====================================================
       BARRAS
       ===================================================== */

    actualizarBarraMovimiento(
        movimientoY
    );


    actualizarBarraDireccion(
        direccionX
    );

}


/* =========================================================
   ANIMACIÓN
   ========================================================= */

let ultimoFrame =
    performance.now();

let contadorFrames = 0;

let tiempoFPS =
    performance.now();


function bucle() {

    actualizarSimulacion();


    contadorFrames++;


    const ahora =
        performance.now();


    if (
        ahora - tiempoFPS >= 1000
    ) {

        diagFPS.textContent =
            contadorFrames;

        contadorFrames = 0;

        tiempoFPS = ahora;

    }


    ultimoFrame = ahora;


    requestAnimationFrame(
        bucle
    );

}


bucle();

   ========================================================= */

document.addEventListener(
    "keydown",
    evento => {

        teclas[
            evento.key.toLowerCase()
        ] = true;


        if (
            evento.key.toLowerCase()
            === "x"
        ) {

            frenado = true;

        }


        if (
            evento.key.toLowerCase()
            === "c"
        ) {

            centrar.click();

        }


        if (
            evento.key.toLowerCase()
            === "shift"
        ) {

            turboActivo = true;

            turbo.classList.add(
                "activo"
            );

        }

    }
);


document.addEventListener(
    "keyup",
    evento => {

        teclas[
            evento.key.toLowerCase()
        ] = false;


        if (
            evento.key.toLowerCase()
            === "x"
        ) {

            frenado = false;

        }


        if (
            evento.key.toLowerCase()
            === "shift"
        ) {

            turboActivo = false;

            turbo.classList.remove(
                "activo"
            );

        }

    }
);
