<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>SPIKE CONTROL</title>

<style>

/* =========================================================
   GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080c14;
    color: white;

    font-family: Arial, sans-serif;
}

body {
    width: 100vw;
    height: 100vh;
}


/* =========================================================
   APP
   ========================================================= */

#app {
    width: 100%;
    height: 100%;

    position: relative;

    overflow: hidden;
}


/* =========================================================
   CABECERA
   ========================================================= */

#top {
    position: absolute;

    top: 8px;
    left: 8px;
    right: 8px;

    height: 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: #111827;

    border: 1px solid #263247;

    border-radius: 12px;

    z-index: 10;
}

#titulo {
    font-size: clamp(15px, 4vw, 21px);
    font-weight: bold;
}

#estado {
    font-size: clamp(11px, 3vw, 14px);
    color: #f87171;
    font-weight: bold;
}


/* =========================================================
   ZONA DE CONTROL
   ========================================================= */

#control {
    position: absolute;

    left: 0;
    right: 0;

    top: 55px;
    bottom: 8px;
}


/* =========================================================
   JOYSTICKS
   ========================================================= */

.joystickArea {
    position: absolute;

    width: min(34vw, 190px);
    height: min(42vh, 220px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}

.joystickTitulo {
    font-size: clamp(10px, 2.5vw, 14px);

    color: #94a3b8;

    margin-bottom: 5px;
}

.joystick {
    width: min(30vw, 170px);
    height: min(30vw, 170px);

    position: relative;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #263653 0%,
            #172238 55%,
            #0f172a 100%
        );

    border: 3px solid #334155;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.5),
        0 6px 18px rgba(0,0,0,.35);

    touch-action: none;
}

.joystick::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 2px;
    height: 80%;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.joystick::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 80%;
    height: 2px;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.palanca {
    position: absolute;

    width: min(11vw, 65px);
    height: min(11vw, 65px);

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #64748b,
            #334155 55%,
            #1e293b
        );

    border: 3px solid #64748b;

    box-shadow:
        0 6px 15px rgba(0,0,0,.6),
        inset 0 3px 7px rgba(255,255,255,.15);

    pointer-events: none;
}


/* =========================================================
   POSICIÓN JOYSTICK IZQUIERDO
   ========================================================= */

#joystickIzquierdo {
    left: 3vw;
    bottom: 8vh;
}


/* =========================================================
   POSICIÓN JOYSTICK DERECHO
   ========================================================= */

#joystickDerecho {
    right: 12vw;
    bottom: 8vh;
}


/* =========================================================
   CENTRO
   ========================================================= */

#centro {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;
}

#robot {
    font-size: clamp(25px, 6vw, 42px);
}

#freno,
#centrar {
    width: clamp(80px, 20vw, 115px);
    height: clamp(40px, 9vw, 52px);

    border: none;

    border-radius: 12px;

    color: white;

    font-size: clamp(10px, 2.7vw, 14px);

    font-weight: bold;
}

#freno {
    background: #dc2626;
}

#centrar {
    background: #475569;
}

#freno:active,
#centrar:active {
    transform: scale(.94);
}


/* =========================================================
   BARRAS EXTREMO DERECHO
   ========================================================= */

#barrasDerecha {
    position: fixed;

    right: 8px;

    top: 50%;

    transform: translateY(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;

    z-index: 20;
}

.medidorContenedor {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 4px;
}

.medidorTitulo {
    font-size: clamp(8px, 2vw, 11px);

    color: #94a3b8;

    writing-mode: vertical-rl;

    transform: rotate(180deg);

    height: 45px;
}

.medidor {
    width: clamp(18px, 5vw, 27px);
    height: min(35vh, 150px);

    position: relative;

    overflow: hidden;

    background: #111827;

    border: 2px solid #64748b;

    border-radius: 14px;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.5);
}

.medidorCentro {
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 2px;

    background: white;

    z-index: 3;
}

.medidorRelleno {
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 0;

    background: #22c55e;

    z-index: 2;
}

.medidorValor {
    font-size: clamp(8px, 2vw, 11px);

    color: #94a3b8;
}


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

#config {
    position: absolute;

    left: 50%;

    bottom: 5px;

    transform: translateX(-50%);

    width: min(45vw, 330px);

    padding: 5px 8px;

    background: #111827;

    border: 1px solid #263247;

    border-radius: 10px;

    z-index: 10;
}

.configLinea {
    display: flex;

    align-items: center;

    gap: 5px;

    margin: 3px 0;
}

.configLinea span {
    width: 60px;

    color: #cbd5e1;

    font-size: 9px;
}

input[type="range"] {
    flex: 1;

    height: 15px;
}

.configLinea b {
    font-size: 9px;

    min-width: 30px;
}


/* =========================================================
   BOTÓN CONECTAR
   ========================================================= */

#conectar {
    position: absolute;

    right: 8px;
    bottom: 8px;

    width: min(25vw, 170px);

    height: 38px;

    border: none;

    border-radius: 10px;

    background: #22c55e;

    color: #052e16;

    font-size: clamp(9px, 2.5vw, 13px);

    font-weight: bold;

    z-index: 30;
}


/* =========================================================
   MÓVILES PEQUEÑOS
   ========================================================= */

@media (max-height: 500px) {

    #top {
        height: 35px;
        top: 5px;
    }

    #control {
        top: 45px;
    }

    #joystickIzquierdo,
    #joystickDerecho {
        bottom: 2vh;
    }

    #config {
        bottom: 2px;
    }

    #conectar {
        bottom: 3px;
        height: 32px;
    }

    .medidor {
        height: 115px;
    }

    #centro {
        gap: 5px;
    }
}


/* =========================================================
   VERTICAL
   ========================================================= */

@media (orientation: portrait) {

    #app::after {
        content: "↻  GIRA EL TELÉFONO";
        
        position: fixed;

        inset: 0;

        z-index: 9999;

        display: flex;

        align-items: center;

        justify-content: center;

        background: #080c14;

        color: white;

        font-size: 24px;

        font-weight: bold;
    }
}

</style>

</head>


<body>


<div id="app">


<!-- =====================================================
     CABECERA
     ===================================================== -->

<div id="top">

    <div id="titulo">
        🎮 SPIKE CONTROL
    </div>

    <div id="estado">
        🔴 DESCONECTADO
    </div>

</div>


<!-- =====================================================
     CONTROL
     ===================================================== -->

<div id="control">


    <!-- =================================================
         JOYSTICK IZQUIERDO
         ================================================= -->

    <div
        id="joystickIzquierdo"
        class="joystickArea"
    >

        <div class="joystickTitulo">
            MOVIMIENTO
        </div>

        <div
            id="joystickMovimiento"
            class="joystick"
        >

            <div class="palanca"></div>

        </div>

    </div>


    <!-- =================================================
         CENTRO
         ================================================= -->

    <div id="centro">

        <div id="robot">
            🤖
        </div>

        <button id="freno">
            ⏹ FRENO
        </button>

        <button id="centrar">
            🎯 CENTRAR
        </button>

    </div>


    <!-- =================================================
         JOYSTICK DERECHO
         ================================================= -->

    <div
        id="joystickDerecho"
        class="joystickArea"
    >

        <div class="joystickTitulo">
            DIRECCIÓN
        </div>

        <div
            id="joystickDireccion"
            class="joystick"
        >

            <div class="palanca"></div>

        </div>

    </div>


    <!-- =================================================
         CONFIGURACIÓN
         ================================================= -->

    <div id="config">

        <div class="configLinea">

            <span>
                VELOCIDAD
            </span>

            <input
                id="velocidad"
                type="range"
                min="100"
                max="1000"
                value="700"
                step="50"
            >

            <b id="velocidadValor">
                700
            </b>

        </div>


        <div class="configLinea">

            <span>
                ÁNGULO
            </span>

            <input
                id="angulo"
                type="range"
                min="10"
                max="180"
                value="90"
                step="5"
            >

            <b id="anguloValor">
                90°
            </b>

        </div>

    </div>


    <!-- =================================================
         CONECTAR
         ================================================= -->

    <button id="conectar">
        🔵 CONECTAR HUB
    </button>

</div>


<!-- =====================================================
     BARRAS
     ===================================================== -->

<div id="barrasDerecha">


    <!-- MOVIMIENTO -->

    <div class="medidorContenedor">

        <div class="medidorTitulo">
            MOV.
        </div>

        <div class="medidor">

            <div
                id="rellenoMovimiento"
                class="medidorRelleno"
            ></div>

            <div
                class="medidorCentro"
            ></div>

        </div>

        <div
            id="valorMovimiento"
            class="medidorValor"
        >
            0%
        </div>

    </div>


    <!-- DIRECCIÓN -->

    <div class="medidorContenedor">

        <div class="medidorTitulo">
            DIR.
        </div>

        <div class="medidor">

            <div
                id="rellenoDireccion"
                class="medidorRelleno"
            ></div>

            <div
                class="medidorCentro"
            ></div>

        </div>

        <div
            id="valorDireccion"
            class="medidorValor"
        >
            0%
        </div>

    </div>

</div>


</div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const joystickMovimiento =
    document.getElementById(
        "joystickMovimiento"
    );

const joystickDireccion =
    document.getElementById(
        "joystickDireccion"
    );

const rellenoMovimiento =
    document.getElementById(
        "rellenoMovimiento"
    );

const rellenoDireccion =
    document.getElementById(
        "rellenoDireccion"
    );

const valorMovimiento =
    document.getElementById(
        "valorMovimiento"
    );

const valorDireccion =
    document.getElementById(
        "valorDireccion"
    );

const velocidad =
    document.getElementById(
        "velocidad"
    );

const velocidadValor =
    document.getElementById(
        "velocidadValor"
    );

const angulo =
    document.getElementById(
        "angulo"
    );

const anguloValor =
    document.getElementById(
        "anguloValor"
    );

const freno =
    document.getElementById(
        "freno"
    );

const centrar =
    document.getElementById(
        "centrar"
    );


/* =========================================================
   VELOCIDAD
   ========================================================= */

velocidad.addEventListener(
    "input",
    () => {

        velocidadValor.textContent =
            velocidad.value;

    }
);


/* =========================================================
   ÁNGULO
   ========================================================= */

angulo.addEventListener(
    "input",
    () => {

        anguloValor.textContent =
            angulo.value + "°";

    }
);


/* =========================================================
   JOYSTICK
   ========================================================= */

function crearJoystick(elemento) {

    const palanca =
        elemento.querySelector(
            ".palanca"
        );

    let activo = false;

    let x = 0;
    let y = 0;


    function mover(evento) {

        if (!activo) {
            return;
        }


        const rect =
            elemento.getBoundingClientRect();


        const centroX =
            rect.width / 2;

        const centroY =
            rect.height / 2;


        let nuevaX =
            evento.clientX -
            rect.left -
            centroX;


        let nuevaY =
            evento.clientY -
            rect.top -
            centroY;


        const max =
            rect.width / 2 - 35;


        const distancia =
            Math.sqrt(
                nuevaX * nuevaX +
                nuevaY * nuevaY
            );


        if (distancia > max) {

            nuevaX =
                nuevaX / distancia * max;

            nuevaY =
                nuevaY / distancia * max;

        }


        x =
            nuevaX / max;

        y =
            nuevaY / max;


        palanca.style.left =
            `calc(50% + ${nuevaX}px)`;

        palanca.style.top =
            `calc(50% + ${nuevaY}px)`;


        actualizarControl();

    }


    function soltar() {

        activo = false;

        x = 0;
        y = 0;


        palanca.style.left =
            "50%";

        palanca.style.top =
            "50%";


        actualizarControl();

    }


    elemento.addEventListener(
        "pointerdown",
        evento => {

            activo = true;

            elemento.setPointerCapture(
                evento.pointerId
            );

            mover(evento);

        }
    );


    elemento.addEventListener(
        "pointermove",
        mover
    );


    elemento.addEventListener(
        "pointerup",
        soltar
    );


    elemento.addEventListener(
        "pointercancel",
        soltar
    );


    return {

        obtenerX: () => x,

        obtenerY: () => y

    };

}


/* =========================================================
   CREAR JOYSTICKS
   ========================================================= */

const movimiento =
    crearJoystick(
        joystickMovimiento
    );

const direccion =
    crearJoystick(
        joystickDireccion
    );


/* =========================================================
   BARRA MOVIMIENTO
   ========================================================= */

function actualizarBarraMovimiento(valor) {

    const porcentaje =
        Math.min(
            100,
            Math.abs(valor) * 100
        );


    valorMovimiento.textContent =
        Math.round(porcentaje) + "%";


    if (valor < 0) {

        rellenoMovimiento.style.top =
            (50 - porcentaje / 2) + "%";

        rellenoMovimiento.style.height =
            porcentaje + "%";

    }

    else if (valor > 0) {

        rellenoMovimiento.style.top =
            "50%";

        rellenoMovimiento.style.height =
            porcentaje + "%";

    }

    else {

        rellenoMovimiento.style.top =
            "50%";

        rellenoMovimiento.style.height =
            "0%";

    }

}


/* =========================================================
   BARRA DIRECCIÓN
   ========================================================= */

function actualizarBarraDireccion(valor) {

    const porcentaje =
        Math.min(
            100,
            Math.abs(valor) * 100
        );


    valorDireccion.textContent =
        Math.round(porcentaje) + "%";


    if (valor < 0) {

        rellenoDireccion.style.top =
            (50 - porcentaje / 2) + "%";

        rellenoDireccion.style.height =
            porcentaje + "%";

    }

    else if (valor > 0) {

        rellenoDireccion.style.top =
            "50%";

        rellenoDireccion.style.height =
            porcentaje + "%";

    }

    else {

        rellenoDireccion.style.top =
            "50%";

        rellenoDireccion.style.height =
            "0%";

    }

}


/* =========================================================
   ACTUALIZAR CONTROL
   ========================================================= */

function actualizarControl() {

    const xMovimiento =
        movimiento.obtenerX();

    const yMovimiento =
        movimiento.obtenerY();

    const xDireccion =
        direccion.obtenerX();


    actualizarBarraMovimiento(
        yMovimiento
    );


    actualizarBarraDireccion(
        xDireccion
    );


    console.log({

        movimientoX:
            xMovimiento,

        movimientoY:
            yMovimiento,

        direccion:
            xDireccion,

        velocidad:
            velocidad.value,

        angulo:
            angulo.value

    });

}


/* =========================================================
   FRENO
   ========================================================= */

freno.addEventListener(
    "pointerdown",
    () => {

        actualizarBarraMovimiento(0);

        actualizarBarraDireccion(0);

        console.log("FRENO");

    }
);


/* =========================================================
   CENTRAR
   ========================================================= */

centrar.addEventListener(
    "pointerdown",
    () => {

        actualizarBarraDireccion(0);

        console.log("CENTRAR");

    }
);


/* =========================================================
   CONECTAR
   ========================================================= */

document
    .getElementById("conectar")
    .addEventListener(
        "click",
        () => {

            alert(
                "La conexión Bluetooth se añadirá después."
            );

        }
    );


/* =========================================================
   INICIO
   ========================================================= */

actualizarBarraMovimiento(0);

actualizarBarraDireccion(0);

</script>

</body>

</html>
