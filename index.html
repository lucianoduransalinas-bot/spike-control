<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>SPIKE CONTROL</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080c14;
    color: white;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}


/* =====================================================
   CABECERA
   ===================================================== */

#top {
    position: absolute;
    top: 1.5vh;
    left: 1.5vw;
    right: 1.5vw;
    height: 7vh;
    min-height: 35px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 2vw;

    background: #111827;
    border: 1px solid #263247;
    border-radius: 12px;

    z-index: 50;
}

#titulo {
    font-size: clamp(14px, 3vw, 22px);
    font-weight: bold;
}

#estado {
    font-size: clamp(10px, 2vw, 14px);
    font-weight: bold;
    color: #f87171;
}


/* =====================================================
   ZONA PRINCIPAL
   ===================================================== */

#control {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}


/* =====================================================
   JOYSTICKS
   ===================================================== */

.joystickArea {
    position: absolute;

    width: 25vw;
    height: 48vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.joystickTitulo {
    margin-bottom: 1vh;

    font-size: clamp(9px, 2vw, 14px);
    color: #94a3b8;
}

.joystick {
    width: min(24vw, 190px);
    height: min(24vw, 190px);

    min-width: 120px;
    min-height: 120px;

    max-width: 190px;
    max-height: 190px;

    position: relative;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #263653 0%,
            #172238 55%,
            #0f172a 100%
        );

    border: 3px solid #334155;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.5),
        0 5px 18px rgba(0,0,0,.4);

    touch-action: none;
}

.joystick::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 2px;
    height: 80%;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.joystick::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 80%;
    height: 2px;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.palanca {
    position: absolute;

    width: min(9vw, 65px);
    height: min(9vw, 65px);

    min-width: 48px;
    min-height: 48px;

    max-width: 65px;
    max-height: 65px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #64748b,
            #334155 55%,
            #1e293b 100%
        );

    border: 3px solid #64748b;

    box-shadow:
        0 6px 15px rgba(0,0,0,.6),
        inset 0 3px 7px rgba(255,255,255,.15);

    pointer-events: none;
}


/* =====================================================
   POSICIÓN JOYSTICK IZQUIERDO
   ===================================================== */

#joystickIzquierdo {
    left: 2vw;
    top: 50%;
    transform: translateY(-45%);
}


/* =====================================================
   POSICIÓN JOYSTICK DERECHO
   ===================================================== */

#joystickDerecho {
    right: 13vw;
    top: 50%;
    transform: translateY(-45%);
}


/* =====================================================
   CENTRO
   ===================================================== */

#centro {
    position: absolute;

    left: 50%;
    top: 53%;

    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 1vh;

    z-index: 20;
}

#robot {
    font-size: clamp(20px, 5vw, 40px);
}

#freno,
#centrar {
    width: clamp(75px, 15vw, 115px);
    height: clamp(38px, 8vh, 52px);

    border: none;
    border-radius: 12px;

    color: white;

    font-size: clamp(9px, 2vw, 14px);
    font-weight: bold;
}

#freno {
    background: #dc2626;
}

#centrar {
    background: #475569;
}

#freno:active,
#centrar:active {
    transform: scale(.94);
}


/* =====================================================
   BARRAS EN EL EXTREMO DERECHO
   ===================================================== */

#barrasDerecha {
    position: fixed;

    right: 1vw;
    top: 50%;

    transform: translateY(-50%);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 2vh;

    z-index: 100;
}

.medidorContenedor {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: .5vh;
}

.medidorTitulo {
    font-size: clamp(7px, 1.6vw, 11px);

    color: #94a3b8;

    writing-mode: vertical-rl;

    transform: rotate(180deg);
}

.medidor {
    width: clamp(17px, 3vw, 27px);

    height: min(30vh, 145px);

    min-height: 80px;

    position: relative;

    overflow: hidden;

    background: #111827;

    border: 2px solid #64748b;

    border-radius: 14px;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.5);
}

.medidorCentro {
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 2px;

    background: white;

    z-index: 3;
}

.medidorRelleno {
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 0;

    background: #22c55e;

    z-index: 2;
}

.medidorValor {
    font-size: clamp(7px, 1.7vw, 11px);
    color: #94a3b8;
}


/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

#config {
    position: fixed;

    left: 50%;
    bottom: 1vh;

    transform: translateX(-50%);

    width: min(38vw, 330px);

    padding: 5px 8px;

    background: #111827;

    border: 1px solid #263247;

    border-radius: 10px;

    z-index: 40;
}

.configLinea {
    display: flex;

    align-items: center;

    gap: 5px;

    margin: 2px 0;
}

.configLinea span {
    width: 55px;

    font-size: 8px;
    color: #cbd5e1;
}

input[type="range"] {
    flex: 1;
    min-width: 0;
    height: 15px;
}

.configLinea b {
    font-size: 8px;
    min-width: 25px;
}


/* =====================================================
   BOTÓN CONECTAR
   ===================================================== */

#conectar {
    position: fixed;

    right: 5vw;
    bottom: 1vh;

    width: min(18vw, 160px);

    height: clamp(32px, 6vh, 42px);

    border: none;
    border-radius: 10px;

    background: #22c55e;

    color: #052e16;

    font-size: clamp(8px, 1.8vw, 13px);

    font-weight: bold;

    z-index: 60;
}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 600px) {

    .joystick {
        width: 27vw;
        height: 27vw;

        min-width: 110px;
        min-height: 110px;
    }

    .palanca {
        width: 16vw;
        height: 16vw;

        min-width: 45px;
        min-height: 45px;
    }

    #joystickIzquierdo {
        left: 1vw;
    }

    #joystickDerecho {
        right: 13vw;
    }

    #barrasDerecha {
        right: .8vw;
    }

    #config {
        width: 42vw;
    }

    #conectar {
        right: 4vw;
        width: 20vw;
    }
}


/* =====================================================
   PANTALLA BAJA
   ===================================================== */

@media (max-height: 450px) {

    #top {
        height: 32px;
    }

    .joystick {
        width: min(25vw, 150px);
        height: min(25vw, 150px);

        min-width: 100px;
        min-height: 100px;
    }

    .palanca {
        width: 50px;
        height: 50px;
    }

    .medidor {
        height: 100px;
    }

    #centro {
        gap: 3px;
    }

    #config {
        display: none;
    }

    #conectar {
        bottom: 3px;
    }
}


/* =====================================================
   VERTICAL
   ===================================================== */

@media (orientation: portrait) {

    #app::after {
        content: "↻  GIRA EL TELÉFONO";

        position: fixed;

        inset: 0;

        z-index: 99999;

        display: flex;

        align-items: center;
        justify-content: center;

        background: #080c14;

        color: white;

        font-size: 24px;

        font-weight: bold;
    }
}

</style>


</head>


<body>


<div id="app">


<!-- =====================================================
     CABECERA
     ===================================================== -->

<div id="top">

    <div id="titulo">
        🎮 SPIKE CONTROL
    </div>

    <div id="estado">
        🔴 DESCONECTADO
    </div>

</div>


<!-- =====================================================
     CONTROL
     ===================================================== -->

<div id="control">


    <!-- =================================================
         JOYSTICK IZQUIERDO
         ================================================= -->

    <div
        id="joystickIzquierdo"
        class="joystickArea"
    >

        <div class="joystickTitulo">
            MOVIMIENTO
        </div>

        <div
            id="joystickMovimiento"
            class="joystick"
        >

            <div class="palanca"></div>

        </div>

    </div>


    <!-- =================================================
         CENTRO
         ================================================= -->

    <div id="centro">

        <div id="robot">
            🤖
        </div>

        <button id="freno">
            ⏹ FRENO
        </button>

        <button id="centrar">
            🎯 CENTRAR
        </button>

    </div>


    <!-- =================================================
         JOYSTICK DERECHO
         ================================================= -->

    <div
        id="joystickDerecho"
        class="joystickArea"
    >

        <div class="joystickTitulo">
            DIRECCIÓN
        </div>

        <div
            id="joystickDireccion"
            class="joystick"
        >

            <div class="palanca"></div>

        </div>

    </div>


    <!-- =================================================
         CONFIGURACIÓN
         ================================================= -->

    <div id="config">

        <div class="configLinea">

            <span>
                VELOCIDAD
            </span>

            <input
                id="velocidad"
                type="range"
                min="100"
                max="1000"
                value="700"
                step="50"
            >

            <b id="velocidadValor">
                700
            </b>

        </div>


        <div class="configLinea">

            <span>
                ÁNGULO
            </span>

            <input
                id="angulo"
                type="range"
                min="10"
                max="180"
                value="90"
                step="5"
            >

            <b id="anguloValor">
                90°
            </b>

        </div>

    </div>


    <!-- =================================================
         CONECTAR
         ================================================= -->

    <button id="conectar">
        🔵 CONECTAR HUB
    </button>

</div>


<!-- =====================================================
     BARRAS
     ===================================================== -->

<div id="barrasDerecha">


    <!-- MOVIMIENTO -->

    <div class="medidorContenedor">

        <div class="medidorTitulo">
            MOV.
        </div>

        <div class="medidor">

            <div
                id="rellenoMovimiento"
                class="medidorRelleno"
            ></div>

            <div
                class="medidorCentro"
            ></div>

        </div>

        <div
            id="valorMovimiento"
            class="medidorValor"
        >
            0%
        </div>

    </div>


    <!-- DIRECCIÓN -->

    <div class="medidorContenedor">

        <div class="medidorTitulo">
            DIR.
        </div>

        <div class="medidor">

            <div
                id="rellenoDireccion"
                class="medidorRelleno"
            ></div>

            <div
                class="medidorCentro"
            ></div>

        </div>

        <div
            id="valorDireccion"
            class="medidorValor"
        >
            0%
        </div>

    </div>


</div>


</div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const joystickMovimiento =
    document.getElementById(
        "joystickMovimiento"
    );

const joystickDireccion =
    document.getElementById(
        "joystickDireccion"
    );

const rellenoMovimiento =
    document.getElementById(
        "rellenoMovimiento"
    );

const rellenoDireccion =
    document.getElementById(
        "rellenoDireccion"
    );

const valorMovimiento =
    document.getElementById(
        "valorMovimiento"
    );

const valorDireccion =
    document.getElementById(
        "valorDireccion"
    );

const velocidad =
    document.getElementById(
        "velocidad"
    );

const velocidadValor =
    document.getElementById(
        "velocidadValor"
    );

const angulo =
    document.getElementById(
        "angulo"
    );

const anguloValor =
    document.getElementById(
        "anguloValor"
    );

const freno =
    document.getElementById(
        "freno"
    );

const centrar =
    document.getElementById(
        "centrar"
    );


/* =========================================================
   VELOCIDAD
   ========================================================= */

velocidad.addEventListener(
    "input",
    () => {

        velocidadValor.textContent =
            velocidad.value;

    }
);


/* =========================================================
   ÁNGULO
   ========================================================= */

angulo.addEventListener(
    "input",
    () => {

        anguloValor.textContent =
            angulo.value + "°";

    }
);


/* =========================================================
   CREAR JOYSTICK
   ========================================================= */

function crearJoystick(elemento) {

    const palanca =
        elemento.querySelector(
            ".palanca"
        );

    let activo = false;

    let x = 0;
    let y = 0;


    function mover(evento) {

        if (!activo) {
            return;
        }

        const rect =
            elemento.getBoundingClientRect();

        const centroX =
            rect.width / 2;

        const centroY =
            rect.height / 2;

        let nuevaX =
            evento.clientX -
            rect.left -
            centroX;

        let nuevaY =
            evento.clientY -
            rect.top -
            centroY;

        const max =
            rect.width / 2 - 35;

        const distancia =
            Math.sqrt(
                nuevaX * nuevaX +
                nuevaY * nuevaY
            );

        if (distancia > max) {

            nuevaX =
                nuevaX / distancia * max;

            nuevaY =
                nuevaY / distancia * max;
        }

        x =
            nuevaX / max;

        y =
            nuevaY / max;

        palanca.style.left =
            `calc(50% + ${nuevaX}px)`;

        palanca.style.top =
            `calc(50% + ${nuevaY}px)`;

        actualizarControl();
    }


    function soltar() {

        activo = false;

        x = 0;
        y = 0;

        palanca.style.left =
            "50%";

        palanca.style.top =
            "50%";

        actualizarControl();
    }


    elemento.addEventListener(
        "pointerdown",
        evento => {

            activo = true;

            elemento.setPointerCapture(
                evento.pointerId
            );

            mover(evento);
        }
    );


    elemento.addEventListener(
        "pointermove",
        mover
    );


    elemento.addEventListener(
        "pointerup",
        soltar
    );


    elemento.addEventListener(
        "pointercancel",
        soltar
    );


    return {

        obtenerX: () => x,

        obtenerY: () => y

    };
}


/* =========================================================
   JOYSTICKS
   ========================================================= */

const movimiento =
    crearJoystick(
        joystickMovimiento
    );

const direccion =
    crearJoystick(
        joystickDireccion
    );


/* =========================================================
   BARRA MOVIMIENTO
   ========================================================= */

function actualizarBarraMovimiento(valor) {

    const porcentaje =
        Math.min(
            100,
            Math.abs(valor) * 100
        );

    valorMovimiento.textContent =
        Math.round(porcentaje) + "%";


    if (valor < 0) {

        rellenoMovimiento.style.top =
            (50 - porcentaje / 2) + "%";

        rellenoMovimiento.style.height =
            porcentaje + "%";

    }

    else if (valor > 0) {

        rellenoMovimiento.style.top =
            "50%";

        rellenoMovimiento.style.height =
            porcentaje + "%";

    }

    else {

        rellenoMovimiento.style.top =
            "50%";

        rellenoMovimiento.style.height =
            "0%";
    }
}


/* =========================================================
   BARRA DIRECCIÓN
   ========================================================= */

function actualizarBarraDireccion(valor) {

    const porcentaje =
        Math.min(
            100,
            Math.abs(valor) * 100
        );

    valorDireccion.textContent =
        Math.round(porcentaje) + "%";


    if (valor < 0) {

        rellenoDireccion.style.top =
            (50 - porcentaje / 2) + "%";

        rellenoDireccion.style.height =
            porcentaje + "%";

    }

    else if (valor > 0) {

        rellenoDireccion.style.top =
            "50%";

        rellenoDireccion.style.height =
            porcentaje + "%";

    }

    else {

        rellenoDireccion.style.top =
            "50%";

        rellenoDireccion.style.height =
            "0%";
    }
}


/* =========================================================
   ACTUALIZAR CONTROL
   ========================================================= */

function actualizarControl() {

    const xMovimiento =
        movimiento.obtenerX();

    const yMovimiento =
        movimiento.obtenerY();

    const xDireccion =
        direccion.obtenerX();


    actualizarBarraMovimiento(
        yMovimiento
    );

    actualizarBarraDireccion(
        xDireccion
    );


    console.log({

        movimientoX:
            xMovimiento,

        movimientoY:
            yMovimiento,

        direccion:
            xDireccion,

        velocidad:
            velocidad.value,

        angulo:
            angulo.value

    });
}


/* =========================================================
   FRENO
   ========================================================= */

freno.addEventListener(
    "pointerdown",
    () => {

        actualizarBarraMovimiento(0);

        actualizarBarraDireccion(0);

        console.log("FRENO");
    }
);


/* =========================================================
   CENTRAR
   ========================================================= */

centrar.addEventListener(
    "pointerdown",
    () => {

        actualizarBarraDireccion(0);

        console.log("CENTRAR");
    }
);


/* =========================================================
   CONECTAR
   ========================================================= */

document
    .getElementById("conectar")
    .addEventListener(
        "click",
        () => {

            alert(
                "La conexión Bluetooth se añadirá después."
            );

        }
    );


/* =========================================================
   INICIO
   ========================================================= */

actualizarBarraMovimiento(0);

actualizarBarraDireccion(0);

</script>

</body>

</html>
