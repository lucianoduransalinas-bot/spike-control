<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>SPIKE CONTROL</title>

<style>

/* =========================================================
   GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080c14;
    color: white;

    font-family: Arial, sans-serif;
}

body {

    display: flex;

    justify-content: center;
    align-items: center;
}

#app {

    width: 100%;
    height: 100%;

    padding: 12px;

    display: flex;

    flex-direction: column;
}


/* =========================================================
   CABECERA
   ========================================================= */

#top {

    height: 55px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    background: #111827;

    border: 1px solid #263247;

    border-radius: 16px;
}

#titulo {

    font-size: 22px;

    font-weight: bold;
}

#estado {

    font-size: 14px;

    color: #f87171;

    font-weight: bold;
}


/* =========================================================
   ZONA PRINCIPAL
   ========================================================= */

#control {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}


/* =========================================================
   JOYSTICKS
   ========================================================= */

.joystickArea {

    width: 260px;
    height: 290px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}

.joystickTitulo {

    font-size: 15px;

    color: #94a3b8;

    margin-bottom: 10px;
}

.joystick {

    width: 220px;
    height: 220px;

    position: relative;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #263653 0%,
            #172238 55%,
            #0f172a 100%
        );

    border: 3px solid #334155;

    box-shadow:

        inset 0 0 30px rgba(0,0,0,.5),

        0 8px 25px rgba(0,0,0,.35);

    touch-action: none;
}

.joystick::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 2px;
    height: 80%;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.joystick::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 80%;
    height: 2px;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.palanca {

    position: absolute;

    width: 80px;
    height: 80px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            #64748b,
            #334155 55%,
            #1e293b
        );

    border: 3px solid #64748b;

    box-shadow:

        0 8px 20px rgba(0,0,0,.6),

        inset 0 3px 8px rgba(255,255,255,.15);

    pointer-events: none;
}


/* =========================================================
   POSICIÓN DOS JOYSTICKS
   ========================================================= */

#joystickIzquierdo {

    position: absolute;

    left: 60px;

    top: 50%;

    transform: translateY(-50%);
}

#joystickDerecho {

    position: absolute;

    right: 170px;

    top: 50%;

    transform: translateY(-50%);
}


/* =========================================================
   CENTRO
   ========================================================= */

#centro {

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}

#robot {

    font-size: 42px;
}

#freno,
#centrar {

    width: 120px;
    height: 55px;

    border: none;

    border-radius: 14px;

    color: white;

    font-size: 15px;

    font-weight: bold;
}

#freno {

    background: #dc2626;
}

#centrar {

    background: #475569;
}

#freno:active,
#centrar:active {

    transform: scale(.94);
}


/* =========================================================
   BARRAS A LA DERECHA DE LA PÁGINA
   ========================================================= */

#barrasDerecha {

    position: fixed;

    right: 20px;

    top: 50%;

    transform: translateY(-50%);

    display: flex;

    flex-direction: column;

    gap: 30px;

    align-items: center;
}


/* =========================================================
   BARRA
   ========================================================= */

.medidorContenedor {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;
}

.medidorTitulo {

    font-size: 12px;

    color: #94a3b8;

    text-align: center;
}

.medidor {

    width: 30px;

    height: 200px;

    position: relative;

    overflow: hidden;

    background: #111827;

    border: 2px solid #64748b;

    border-radius: 18px;

    box-shadow:

        inset 0 0 12px rgba(0,0,0,.5);
}

.medidorCentro {

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 2px;

    background: white;

    z-index: 3;
}

.medidorRelleno {

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 0;

    background: #22c55e;

    z-index: 2;

    transition:

        top .04s linear,

        height .04s linear;
}

.medidorValor {

    font-size: 12px;

    color: #94a3b8;
}


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

#config {

    position: absolute;

    bottom: 75px;

    left: 50%;

    transform: translateX(-50%);

    width: 420px;

    padding: 10px 15px;

    background: #111827;

    border: 1px solid #263247;

    border-radius: 16px;
}

.configLinea {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 6px 0;
}

.configLinea span {

    width: 80px;

    color: #cbd5e1;

    font-size: 13px;
}

input[type="range"] {

    flex: 1;
}


/* =========================================================
   CONECTAR
   ========================================================= */

#conectar {

    position: absolute;

    bottom: 12px;

    left: 50%;

    transform: translateX(-50%);

    width: 420px;

    height: 52px;

    border: none;

    border-radius: 14px;

    background: #22c55e;

    color: #052e16;

    font-size: 17px;

    font-weight: bold;
}


/* =========================================================
   MÓVIL
   ========================================================= */

@media (max-width: 800px) {

    #joystickIzquierdo {

        left: 25px;
    }

    #joystickDerecho {

        right: 100px;
    }

    #barrasDerecha {

        right: 10px;
    }

    #config,
    #conectar {

        width: 300px;
    }

    .joystick {

        width: 180px;
        height: 180px;
    }

    .palanca {

        width: 65px;
        height: 65px;
    }

    .joystickArea {

        width: 210px;
        height: 240px;
    }
}


/* =========================================================
   VERTICAL
   ========================================================= */

@media (orientation: portrait) {

    body::before {

        content:
            "↻ GIRA EL TELÉFONO";

        position: fixed;

        inset: 0;

        z-index: 9999;

        display: flex;

        justify-content: center;

        align-items: center;

        background: #080c14;

        color: white;

        font-size: 25px;

        font-weight: bold;
    }
}

</style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         CABECERA
         ===================================================== -->

    <div id="top">

        <div id="titulo">
            🎮 SPIKE CONTROL
        </div>

        <div id="estado">
            🔴 DESCONECTADO
        </div>

    </div>


    <!-- =====================================================
         ZONA DE CONTROL
         ===================================================== -->

    <div id="control">


        <!-- =================================================
             JOYSTICK IZQUIERDO
             ================================================= -->

        <div
            id="joystickIzquierdo"
            class="joystickArea"
        >

            <div class="joystickTitulo">
                MOVIMIENTO
            </div>

            <div
                id="joystickMovimiento"
                class="joystick"
            >

                <div class="palanca"></div>

            </div>

        </div>


        <!-- =================================================
             CENTRO
             ================================================= -->

        <div id="centro">

            <div id="robot">
                🤖
            </div>

            <button id="freno">
                ⏹ FRENO
            </button>

            <button id="centrar">
                🎯 CENTRAR
            </button>

        </div>


        <!-- =================================================
             JOYSTICK DERECHO
             ================================================= -->

        <div
            id="joystickDerecho"
            class="joystickArea"
        >

            <div class="joystickTitulo">
                DIRECCIÓN
            </div>

            <div
                id="joystickDireccion"
                class="joystick"
            >

                <div class="palanca"></div>

            </div>

        </div>


        <!-- =================================================
             CONFIGURACIÓN
             ================================================= -->

        <div id="config">

            <div class="configLinea">

                <span>
                    VELOCIDAD
                </span>

                <input
                    id="velocidad"
                    type="range"
                    min="100"
                    max="1000"
                    value="700"
                    step="50"
                >

                <b id="velocidadValor">
                    700
                </b>

            </div>


            <div class="configLinea">

                <span>
                    ÁNGULO
                </span>

                <input
                    id="angulo"
                    type="range"
                    min="10"
                    max="180"
                    value="90"
                    step="5"
                >

                <b id="anguloValor">
                    90°
                </b>

            </div>

        </div>


        <!-- =================================================
             CONECTAR
             ================================================= -->

        <button id="conectar">
            🔵 CONECTAR HUB
        </button>

    </div>


    <!-- =====================================================
         BARRAS DERECHA
         ===================================================== -->

    <div id="barrasDerecha">


        <!-- BARRA MOVIMIENTO -->

        <div class="medidorContenedor">

            <div class="medidorTitulo">
                MOVIMIENTO
            </div>

            <div class="medidor">

                <div
                    id="rellenoMovimiento"
                    class="medidorRelleno"
                ></div>

                <div
                    class="medidorCentro"
                ></div>

            </div>

            <div
                id="valorMovimiento"
                class="medidorValor"
            >
                0%
            </div>

        </div>


        <!-- BARRA DIRECCIÓN -->

        <div class="medidorContenedor">

            <div class="medidorTitulo">
                DIRECCIÓN
            </div>

            <div class="medidor">

                <div
                    id="rellenoDireccion"
                    class="medidorRelleno"
                ></div>

                <div
                    class="medidorCentro"
                ></div>

            </div>

            <div
                id="valorDireccion"
                class="medidorValor"
            >
                0%
            </div>

        </div>

    </div>


</div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const joystickMovimiento =
    document.getElementById(
        "joystickMovimiento"
    );

const joystickDireccion =
    document.getElementById(
        "joystickDireccion"
    );

const rellenoMovimiento =
    document.getElementById(
        "rellenoMovimiento"
    );

const rellenoDireccion =
    document.getElementById(
        "rellenoDireccion"
    );

const valorMovimiento =
    document.getElementById(
        "valorMovimiento"
    );

const valorDireccion =
    document.getElementById(
        "valorDireccion"
    );

const velocidad =
    document.getElementById(
        "velocidad"
    );

const velocidadValor =
    document.getElementById(
        "velocidadValor"
    );

const angulo =
    document.getElementById(
        "angulo"
    );

const anguloValor =
    document.getElementById(
        "anguloValor"
    );

const freno =
    document.getElementById(
        "freno"
    );

const centrar =
    document.getElementById(
        "centrar"
    );


/* =========================================================
   SLIDER VELOCIDAD
   ========================================================= */

velocidad.addEventListener(
    "input",
    () => {

        velocidadValor.textContent =
            velocidad.value;

    }
);


/* =========================================================
   SLIDER ÁNGULO
   ========================================================= */

angulo.addEventListener(
    "input",
    () => {

        anguloValor.textContent =
            angulo.value + "°";

    }
);


/* =========================================================
   CREAR JOYSTICK
   ========================================================= */

function crearJoystick(elemento) {

    const palanca =
        elemento.querySelector(
            ".palanca"
        );

    let activo = false;

    let x = 0;
    let y = 0;


    function mover(evento) {

        if (!activo) {
            return;
        }


        const rect =
            elemento.getBoundingClientRect();


        const centroX =
            rect.width / 2;

        const centroY =
            rect.height / 2;


        let nuevaX =
            evento.clientX -
            rect.left -
            centroX;


        let nuevaY =
            evento.clientY -
            rect.top -
            centroY;


        const max =
            rect.width / 2 - 42;


        const distancia =
            Math.sqrt(
                nuevaX * nuevaX +
                nuevaY * nuevaY
            );


        if (distancia > max) {

            nuevaX =
                nuevaX / distancia * max;

            nuevaY =
                nuevaY / distancia * max;

        }


        x =
            nuevaX / max;

        y =
            nuevaY / max;


        palanca.style.left =
            `calc(50% + ${nuevaX}px)`;

        palanca.style.top =
            `calc(50% + ${nuevaY}px)`;


        actualizarControl();

    }


    function soltar() {

        activo = false;

        x = 0;
        y = 0;


        palanca.style.left =
            "50%";

        palanca.style.top =
            "50%";


        actualizarControl();

    }


    elemento.addEventListener(
        "pointerdown",
        evento => {

            activo = true;

            elemento.setPointerCapture(
                evento.pointerId
            );

            mover(evento);

        }
    );


    elemento.addEventListener(
        "pointermove",
        mover
    );


    elemento.addEventListener(
        "pointerup",
        soltar
    );


    elemento.addEventListener(
        "pointercancel",
        soltar
    );


    return {

        obtenerX: () => x,

        obtenerY: () => y

    };

}


/* =========================================================
   JOYSTICKS
   ========================================================= */

const movimiento =
    crearJoystick(
        joystickMovimiento
    );

const direccion =
    crearJoystick(
        joystickDireccion
    );


/* =========================================================
   BARRA MOVIMIENTO
   ========================================================= */

function actualizarBarraMovimiento(valor) {

    const porcentaje =
        Math.min(
            100,
            Math.abs(valor) * 100
        );


    valorMovimiento.textContent =
        Math.round(porcentaje) + "%";


    if (valor < 0) {

        /* ARRIBA */

        rellenoMovimiento.style.top =
            (50 - porcentaje / 2) + "%";

        rellenoMovimiento.style.height =
            porcentaje + "%";

    }

    else if (valor > 0) {

        /* ABAJO */

        rellenoMovimiento.style.top =
            "50%";

        rellenoMovimiento.style.height =
            porcentaje + "%";

    }

    else {

        rellenoMovimiento.style.top =
            "50%";

        rellenoMovimiento.style.height =
            "0%";

    }

}


/* =========================================================
   BARRA DIRECCIÓN
   ========================================================= */

function actualizarBarraDireccion(valor) {

    const porcentaje =
        Math.min(
            100,
            Math.abs(valor) * 100
        );


    valorDireccion.textContent =
        Math.round(porcentaje) + "%";


    if (valor < 0) {

        rellenoDireccion.style.top =
            (50 - porcentaje / 2) + "%";

        rellenoDireccion.style.height =
            porcentaje + "%";

    }

    else if (valor > 0) {

        rellenoDireccion.style.top =
            "50%";

        rellenoDireccion.style.height =
            porcentaje + "%";

    }

    else {

        rellenoDireccion.style.top =
            "50%";

        rellenoDireccion.style.height =
            "0%";

    }

}


/* =========================================================
   ACTUALIZAR CONTROL
   ========================================================= */

function actualizarControl() {

    const xMovimiento =
        movimiento.obtenerX();

    const yMovimiento =
        movimiento.obtenerY();

    const xDireccion =
        direccion.obtenerX();


    actualizarBarraMovimiento(
        yMovimiento
    );


    actualizarBarraDireccion(
        xDireccion
    );


    console.log({

        movimientoX:
            xMovimiento,

        movimientoY:
            yMovimiento,

        direccion:
            xDireccion,

        velocidad:
            velocidad.value,

        angulo:
            angulo.value

    });

}


/* =========================================================
   FRENO
   ========================================================= */

freno.addEventListener(
    "pointerdown",
    () => {

        actualizarBarraMovimiento(0);

        actualizarBarraDireccion(0);

        console.log("FRENO");

    }
);


/* =========================================================
   CENTRAR
   ========================================================= */

centrar.addEventListener(
    "pointerdown",
    () => {

        actualizarBarraDireccion(0);

        console.log("CENTRAR");

    }
);


/* =========================================================
   CONECTAR
   ========================================================= */

document
    .getElementById("conectar")
    .addEventListener(
        "click",
        () => {

            alert(
                "La conexión Bluetooth se añadirá cuando tengamos el SPIKE Prime."
            );

        }
    );


/* =========================================================
   INICIO
   ========================================================= */

actualizarBarraMovimiento(0);

actualizarBarraDireccion(0);

</script>

</body>

</html>
