<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIKE Control</title>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        #estado {
            text-align: center;
            margin-bottom: 20px;
            color: #f87171;
            font-weight: bold;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 20px;
            background: #25304a;
            color: white;
            font-size: 22px;
            font-weight: bold;
            min-height: 80px;
            touch-action: none;
            margin: 6px 0;
        }

        button:active {
            transform: scale(0.96);
        }

        #conectar {
            background: #22c55e;
            color: #062e14;
            min-height: 60px;
        }

        .fila {
            display: flex;
            gap: 10px;
        }

        .fila button {
            flex: 1;
        }

        #freno {
            background: #ef4444;
        }

        #centrar {
            background: #475569;
        }

        .control {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
        }

        #velocidadTexto,
        #anguloTexto {
            text-align: center;
            color: #94a3b8;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div id="app">

    <h1>SPIKE CONTROL</h1>

    <div id="estado">
        DESCONECTADO
    </div>

    <button id="conectar">
        🔵 CONECTAR HUB
    </button>

    <div class="control">

        <button id="avanzar">
            ▲
            <br>
            AVANZAR
        </button>

        <div class="fila">

            <button id="izquierda">
                ◀
                <br>
                IZQUIERDA
            </button>

            <button id="freno">
                X
                <br>
                FRENO
            </button>

            <button id="derecha">
                ▶
                <br>
                DERECHA
            </button>

        </div>

        <button id="retroceder">
            ▼
            <br>
            RETROCEDER
        </button>

        <div class="fila">

            <button id="centrar">
                C
                <br>
                CENTRAR
            </button>

        </div>

    </div>

    <div class="control">

        <label>
            Velocidad
        </label>

        <input
            id="velocidad"
            type="range"
            min="100"
            max="1000"
            value="700"
            step="50"
        >

        <div id="velocidadTexto">
            700
        </div>

    </div>

    <div class="control">

        <label>
            Ángulo de giro
        </label>

        <input
            id="angulo"
            type="range"
            min="10"
            max="180"
            value="90"
            step="5"
        >

        <div id="anguloTexto">
            90°
        </div>

    </div>

</div>

<script>

    let dispositivo = null;
    let servidor = null;
    let servicio = null;
    let caracteristica = null;

    const SERVICIO_PYBRICKS =
        "c5f50001-8280-46da-89f4-6d8051e4aeef";

    const CARACTERISTICA_PYBRICKS =
        "c5f50002-8280-46da-89f4-6d8051e4aeef";

    const WRITE_STDIN = 6;

    const estado = document.getElementById("estado");

    const velocidad = document.getElementById("velocidad");
    const velocidadTexto = document.getElementById("velocidadTexto");

    const angulo = document.getElementById("angulo");
    const anguloTexto = document.getElementById("anguloTexto");


    velocidad.addEventListener("input", () => {

        velocidadTexto.textContent =
            velocidad.value;

    });


    angulo.addEventListener("input", () => {

        anguloTexto.textContent =
            angulo.value + "°";

    });


    async function conectar() {

        try {

            estado.textContent = "BUSCANDO HUB...";
            estado.style.color = "#facc15";

            dispositivo =
                await navigator.bluetooth.requestDevice({

                    filters: [
                        {
                            services: [
                                SERVICIO_PYBRICKS
                            ]
                        }
                    ],

                    optionalServices: [
                        SERVICIO_PYBRICKS
                    ]

                });


            servidor =
                await dispositivo.gatt.connect();


            servicio =
                await servidor.getPrimaryService(
                    SERVICIO_PYBRICKS
                );


            caracteristica =
                await servicio.getCharacteristic(
                    CARACTERISTICA_PYBRICKS
                );


            estado.textContent = "CONECTADO";
            estado.style.color = "#4ade80";


        } catch (error) {

            console.error(error);

            estado.textContent = "ERROR DE CONEXIÓN";
            estado.style.color = "#ef4444";

        }

    }


    async function enviar(comando) {

        if (!caracteristica) {
            return;
        }

        const texto =
            comando + "\n";

        const datos =
            new TextEncoder().encode(texto);

        const paquete =
            new Uint8Array(
                datos.length + 1
            );

        paquete[0] = WRITE_STDIN;

        paquete.set(
            datos,
            1
        );

        try {

            await caracteristica.writeValueWithoutResponse(
                paquete
            );

        } catch (error) {

            console.error(error);

        }

    }


    function movimiento(id, comando) {

        const boton =
            document.getElementById(id);

        let pulsado = false;


        boton.addEventListener(
            "pointerdown",
            async (evento) => {

                evento.preventDefault();

                if (pulsado) {
                    return;
                }

                pulsado = true;

                boton.setPointerCapture(
                    evento.pointerId
                );

                await enviar(comando());

            }
        );


        boton.addEventListener(
            "pointerup",
            async (evento) => {

                evento.preventDefault();

                if (!pulsado) {
                    return;
                }

                pulsado = false;

                await enviar("X");

            }
        );


        boton.addEventListener(
            "pointercancel",
            async () => {

                if (!pulsado) {
                    return;
                }

                pulsado = false;

                await enviar("X");

            }
        );

    }


    document
        .getElementById("conectar")
        .addEventListener(
            "click",
            conectar
        );


    movimiento(
        "avanzar",
        () =>
            "W " + velocidad.value
    );


    movimiento(
        "retroceder",
        () =>
            "S " + velocidad.value
    );


    movimiento(
        "izquierda",
        () =>
            "A " + angulo.value
    );


    movimiento(
        "derecha",
        () =>
            "D " + angulo.value
    );


    document
        .getElementById("freno")
        .addEventListener(
            "pointerdown",
            () => enviar("X")
        );


    document
        .getElementById("centrar")
        .addEventListener(
            "pointerdown",
            () => enviar("C")
        );


    window.addEventListener(
        "beforeunload",
        () => {

            try {
                enviar("X");
            } catch {}

        }
    );

</script>

</body>
</html>
