<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>SPIKE CONTROL</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080c14;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 100%;
    height: 100%;
    max-width: 1100px;

    display: flex;
    flex-direction: column;

    padding: 12px;
}

/* =========================================================
   CABECERA
   ========================================================= */

#top {

    height: 55px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    background: #111827;

    border: 1px solid #263247;

    border-radius: 16px;
}

#titulo {

    font-size: 22px;

    font-weight: bold;

}

#estado {

    font-size: 14px;

    color: #f87171;

    font-weight: bold;

}

/* =========================================================
   ZONA PRINCIPAL
   ========================================================= */

#control {

    flex: 1;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    padding: 10px;
}

/* =========================================================
   JOYSTICKS
   ========================================================= */

.joystickArea {

    width: 300px;
    height: 300px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}

.joystickTitulo {

    font-size: 15px;

    color: #94a3b8;

    margin-bottom: 10px;

}

.joystick {

    width: 230px;
    height: 230px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #263653 0%,
            #172238 55%,
            #0f172a 100%
        );

    border: 3px solid #334155;

    position: relative;

    box-shadow:

        inset 0 0 30px rgba(0,0,0,.5),

        0 8px 25px rgba(0,0,0,.35);

    touch-action: none;
}

.joystick::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 2px;
    height: 80%;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.joystick::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 80%;
    height: 2px;

    background: rgba(255,255,255,.08);

    transform: translate(-50%, -50%);
}

.palanca {

    position: absolute;

    width: 85px;
    height: 85px;

    border-radius: 50%;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background:

        radial-gradient(
            circle at 35% 30%,
            #64748b,
            #334155 55%,
            #1e293b
        );

    border: 3px solid #64748b;

    box-shadow:

        0 8px 20px rgba(0,0,0,.6),

        inset 0 3px 8px rgba(255,255,255,.15);

    z-index: 5;

    pointer-events: none;

}

/* =========================================================
   CENTRO
   ========================================================= */

#centro {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 12px;

}

#robot {

    font-size: 42px;

}

#freno,
#centrar {

    width: 120px;

    height: 55px;

    border: none;

    border-radius: 14px;

    color: white;

    font-weight: bold;

    font-size: 15px;

}

#freno {

    background: #dc2626;

}

#centrar {

    background: #475569;

}

#freno:active,
#centrar:active {

    transform: scale(.94);

}

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

#config {

    background: #111827;

    border: 1px solid #263247;

    border-radius: 16px;

    padding: 10px 15px;

}

.configLinea {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 6px 0;

}

.configLinea span {

    width: 80px;

    color: #cbd5e1;

    font-size: 13px;

}

input[type="range"] {

    flex: 1;

}

/* =========================================================
   CONECTAR
   ========================================================= */

#conectar {

    width: 100%;

    height: 52px;

    margin-top: 8px;

    border: none;

    border-radius: 14px;

    background: #22c55e;

    color: #052e16;

    font-size: 17px;

    font-weight: bold;

}

#conectar:active {

    transform: scale(.98);

}

/* =========================================================
   MÓVIL
   ========================================================= */

@media (max-width: 700px) {

    #control {

        gap: 2px;

    }

    .joystickArea {

        width: 42vw;

        height: 230px;

    }

    .joystick {

        width: 42vw;

        height: 42vw;

        max-width: 200px;

        max-height: 200px;

    }

    .palanca {

        width: 70px;

        height: 70px;

    }

    #robot {

        display: none;

    }

    #centro {

        gap: 7px;

    }

    #freno,
    #centrar {

        width: 90px;

        height: 48px;

        font-size: 12px;

    }

}

</style>

</head>

<body>

<div id="app">

    <!-- =====================================================
         CABECERA
         ===================================================== -->

    <div id="top">

        <div id="titulo">
            🎮 SPIKE CONTROL
        </div>

        <div id="estado">
            🔴 DESCONECTADO
        </div>

    </div>


    <!-- =====================================================
         JOYSTICKS
         ===================================================== -->

    <div id="control">


        <!-- JOYSTICK IZQUIERDO -->

        <div class="joystickArea">

            <div class="joystickTitulo">
                MOVIMIENTO
            </div>

            <div
                id="joystickMovimiento"
                class="joystick"
            >

                <div class="palanca"></div>

            </div>

        </div>


        <!-- CENTRO -->

        <div id="centro">

            <div id="robot">
                🤖
            </div>

            <button id="freno">
                ⏹ FRENO
            </button>

            <button id="centrar">
                🎯 CENTRAR
            </button>

        </div>


        <!-- JOYSTICK DERECHO -->

        <div class="joystickArea">

            <div class="joystickTitulo">
                DIRECCIÓN
            </div>

            <div
                id="joystickDireccion"
                class="joystick"
            >

                <div class="palanca"></div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         CONFIGURACIÓN
         ===================================================== -->

    <div id="config">

        <div class="configLinea">

            <span>
                VELOCIDAD
            </span>

            <input
                id="velocidad"
                type="range"
                min="100"
                max="1000"
                value="700"
                step="50"
            >

            <b id="velocidadValor">
                700
            </b>

        </div>


        <div class="configLinea">

            <span>
                ÁNGULO
            </span>

            <input
                id="angulo"
                type="range"
                min="10"
                max="180"
                value="90"
                step="5"
            >

            <b id="anguloValor">
                90°
            </b>

        </div>

    </div>


    <!-- =====================================================
         BOTÓN BLUETOOTH
         ===================================================== -->

    <button id="conectar">
        🔵 CONECTAR HUB
    </button>

</div>


<script>

/* =========================================================
   VARIABLES
   ========================================================= */

const joystickMovimiento =
    document.getElementById(
        "joystickMovimiento"
    );

const joystickDireccion =
    document.getElementById(
        "joystickDireccion"
    );

const estado =
    document.getElementById(
        "estado"
    );

const velocidad =
    document.getElementById(
        "velocidad"
    );

const velocidadValor =
    document.getElementById(
        "velocidadValor"
    );

const angulo =
    document.getElementById(
        "angulo"
    );

const anguloValor =
    document.getElementById(
        "anguloValor"
    );

const freno =
    document.getElementById(
        "freno"
    );

const centrar =
    document.getElementById(
        "centrar"
    );


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

velocidad.addEventListener(
    "input",
    () => {

        velocidadValor.textContent =
            velocidad.value;

    }
);


angulo.addEventListener(
    "input",
    () => {

        anguloValor.textContent =
            angulo.value + "°";

    }
);


/* =========================================================
   JOYSTICK
   ========================================================= */

function crearJoystick(elemento, tipo) {

    const palanca =
        elemento.querySelector(
            ".palanca"
        );

    let activo = false;

    let x = 0;
    let y = 0;


    function mover(evento) {

        if (!activo) {
            return;
        }


        const rect =
            elemento.getBoundingClientRect();


        const centroX =
            rect.width / 2;

        const centroY =
            rect.height / 2;


        let nuevaX =
            evento.clientX -
            rect.left -
            centroX;


        let nuevaY =
            evento.clientY -
            rect.top -
            centroY;


        const max =
            rect.width / 2 - 45;


        const distancia =
            Math.sqrt(
                nuevaX * nuevaX +
                nuevaY * nuevaY
            );


        if (distancia > max) {

            nuevaX =
                nuevaX / distancia * max;

            nuevaY =
                nuevaY / distancia * max;

        }


        x =
            nuevaX / max;

        y =
            nuevaY / max;


        palanca.style.left =
            `calc(50% + ${nuevaX}px)`;

        palanca.style.top =
            `calc(50% + ${nuevaY}px)`;


        actualizarControl();

    }


    function soltar() {

        activo = false;

        x = 0;
        y = 0;


        palanca.style.left =
            "50%";

        palanca.style.top =
            "50%";


        actualizarControl();

    }


    elemento.addEventListener(
        "pointerdown",
        evento => {

            activo = true;

            elemento.setPointerCapture(
                evento.pointerId
            );

            mover(evento);

        }
    );


    elemento.addEventListener(
        "pointermove",
        mover
    );


    elemento.addEventListener(
        "pointerup",
        soltar
    );


    elemento.addEventListener(
        "pointercancel",
        soltar
    );


    return {

        obtenerX: () => x,

        obtenerY: () => y

    };

}


/* =========================================================
   CREAR JOYSTICKS
   ========================================================= */

const movimiento =
    crearJoystick(
        joystickMovimiento,
        "movimiento"
    );


const direccion =
    crearJoystick(
        joystickDireccion,
        "direccion"
    );


/* =========================================================
   CONTROL VIRTUAL
   ========================================================= */

function actualizarControl() {

    const xMovimiento =
        movimiento.obtenerX();

    const yMovimiento =
        movimiento.obtenerY();


    const xDireccion =
        direccion.obtenerX();


    /*
        En esta versión todavía
        NO enviamos Bluetooth.

        Solo mostramos el control
        visualmente.

        Más adelante:

        yMovimiento > 0
            = retroceder

        yMovimiento < 0
            = avanzar

        xDireccion < 0
            = izquierda

        xDireccion > 0
            = derecha
    */


    console.log({

        movimientoX:
            xMovimiento,

        movimientoY:
            yMovimiento,

        direccionX:
            xDireccion,

        velocidad:
            velocidad.value,

        angulo:
            angulo.value

    });

}


/* =========================================================
   BOTONES
   ========================================================= */

freno.addEventListener(
    "pointerdown",
    () => {

        console.log(
            "FRENO"
        );

    }
);


centrar.addEventListener(
    "pointerdown",
    () => {

        console.log(
            "CENTRAR"
        );

    }
);


/* =========================================================
   CONEXIÓN
   ========================================================= */

document
    .getElementById("conectar")
    .addEventListener(
        "click",
        () => {

            alert(
                "La conexión Bluetooth se activará cuando hagamos la prueba con el SPIKE Prime."
            );

        }
    );

</script>

</body>
</html>
